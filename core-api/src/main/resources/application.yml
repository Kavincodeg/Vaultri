spring:
  application:
    name: core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org:
      hibernate:
        engine:
          jdbc:
            spi:
              SqlExceptionHelper: OFF

vaultri:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-min-32-bytes!}
    issuer: vaultri-core-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cancellation:
    fee-percent: 50
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@vaultri.com}
    connection-timeout: ${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
    timeout: ${MAIL_SMTP_TIMEOUT:10000}
    write-timeout: ${MAIL_SMTP_WRITETIMEOUT:10000}
