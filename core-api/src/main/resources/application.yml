spring:
  application:
    name: core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org:
      hibernate:
        engine:
          jdbc:
            spi:
              SqlExceptionHelper: OFF

vaultri:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-do-not-use-in-production-min-32-bytes!}
    issuer: vaultri-core-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cancellation:
    fee-percent: 50
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    base-url: ${RAZORPAY_BASE_URL:https://api.razorpay.com}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@vaultri.com}
    connection-timeout: ${MAIL_SMTP_CONNECTIONTIMEOUT:5000}
    timeout: ${MAIL_SMTP_TIMEOUT:10000}
    write-timeout: ${MAIL_SMTP_WRITETIMEOUT:10000}
  reminders:
    scheduler-cron: ${REMINDERS_SCHEDULER_CRON:0 0 */12 * * *}
    max-run-duration: ${REMINDERS_MAX_RUN_DURATION:5m}
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:false}
    trusted-proxy-count: ${RATELIMIT_TRUSTED_PROXY_COUNT:0}
    rules:
      auth-login-ip:
        limit: ${RATELIMIT_AUTH_LOGIN_IP_LIMIT:10}
        window: ${RATELIMIT_AUTH_LOGIN_IP_WINDOW:1m}
      auth-login-email:
        limit: ${RATELIMIT_AUTH_LOGIN_EMAIL_LIMIT:5}
        window: ${RATELIMIT_AUTH_LOGIN_EMAIL_WINDOW:15m}
      auth-signup:
        limit: ${RATELIMIT_AUTH_SIGNUP_LIMIT:5}
        window: ${RATELIMIT_AUTH_SIGNUP_WINDOW:1h}
      auth-refresh:
        limit: ${RATELIMIT_AUTH_REFRESH_LIMIT:30}
        window: ${RATELIMIT_AUTH_REFRESH_WINDOW:1m}
      seller-deals:
        limit: ${RATELIMIT_SELLER_DEALS_LIMIT:60}
        window: ${RATELIMIT_SELLER_DEALS_WINDOW:1m}
      webhook:
        limit: ${RATELIMIT_WEBHOOK_LIMIT:600}
        window: ${RATELIMIT_WEBHOOK_WINDOW:1m}
  cache:
    enabled: ${CACHE_ENABLED:false}
    ttl: ${CACHE_REPORT_TTL:60s}
